scenario_id: factory-reach-pass        # Unique identifier for this scenario
version: 1                             # Schema version — increment on breaking changes
robot_model: unitree_g1                # Robot model from MuJoCo Menagerie

task:
  task_type: factory_reach             # Controller: stand_still | factory_reach
  description: "Robot reaches toward workstation on factory floor — balanced controller."
  max_duration_s: 30.0                 # Max sim time in seconds (default 30)

# Objects placed in the scene before simulation starts
object_placements: []

# Domain randomization settings
randomization:
  seed: null                           # Random seed (null = non-deterministic)
  position_noise_std: 0.0              # Gaussian noise std on positions (meters)
