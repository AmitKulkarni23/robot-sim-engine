services:
  influxdb:
    image: influxdb:2.7
    container_name: robot-sim-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=demo1234
      - DOCKER_INFLUXDB_INIT_ORG=robot-sim
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=robot-sim-demo-token
      - DOCKER_INFLUXDB_INIT_RETENTION=2h
    volumes:
      - influxdb-data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:11.1.0
    container_name: robot-sim-grafana
    depends_on:
      - influxdb
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=demo1234
    volumes:
      - ./provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana

volumes:
  influxdb-data:
  grafana-data:
