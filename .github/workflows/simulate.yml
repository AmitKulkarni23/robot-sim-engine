name: Run Simulation

on:
  push:
    branches: [main]
    paths:
      - "backend/src/control/**"
      - "backend/scenarios/**"
      - "backend/scenes/**"
  workflow_dispatch:
    inputs:
      scenario_id:
        description: "Scenario ID to simulate"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - box-pickup-standard-5kg
          - box-pickup-randomized-weight
          - walk-to-station-b
          - pallet-stack-3-box
          - obstacle-avoidance-cones
      version:
        description: "Scenario version"
        required: false
        default: "1"
        type: string

env:
  LAMBDA_FUNCTION_URL: ${{ secrets.SIMULATOR_FUNCTION_URL }}
  WEBHOOK_SECRET: ${{ secrets.SIMULATOR_WEBHOOK_SECRET }}

jobs:
  simulate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario:
          - box-pickup-standard-5kg
          - box-pickup-randomized-weight
          - walk-to-station-b
          - pallet-stack-3-box
          - obstacle-avoidance-cones
      fail-fast: false

    steps:
      - name: Check if scenario should run
        id: check
        run: |
          INPUT="${{ github.event.inputs.scenario_id || 'all' }}"
          if [[ "$INPUT" == "all" || "$INPUT" == "${{ matrix.scenario }}" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger simulation
        if: steps.check.outputs.should_run == 'true'
        id: trigger
        run: |
          VERSION="${{ github.event.inputs.version || '1' }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$LAMBDA_FUNCTION_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "{\"scenario_id\": \"${{ matrix.scenario }}\", \"version\": $VERSION}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [[ "$HTTP_CODE" -ne 200 ]]; then
            echo "::error::Simulation failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi

          RUN_ID=$(echo "$BODY" | jq -r '.run_id // empty')
          SUCCESS=$(echo "$BODY" | jq -r '.success // empty')

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "success=$SUCCESS" >> "$GITHUB_OUTPUT"

          if [[ "$SUCCESS" != "true" ]]; then
            echo "::warning::Simulation ${{ matrix.scenario }} failed (run_id: $RUN_ID)"
          fi

      - name: Summary
        if: steps.check.outputs.should_run == 'true'
        run: |
          echo "## Simulation Result: ${{ matrix.scenario }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Run ID**: ${{ steps.trigger.outputs.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Success**: ${{ steps.trigger.outputs.success }}" >> "$GITHUB_STEP_SUMMARY"
